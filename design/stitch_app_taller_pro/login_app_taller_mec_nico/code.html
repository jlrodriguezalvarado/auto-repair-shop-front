<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - App Taller Mecánico</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#005236",
                        "on-surface": "#191c1e",
                        "on-tertiary-container": "#10b981",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f8f9fb",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed-dim": "#a2cbed",
                        "secondary-fixed": "#ffdeac",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#002a1a",
                        "inverse-primary": "#a2cbed",
                        "background": "#f8f9fb",
                        "surface-bright": "#f8f9fb",
                        "surface-tint": "#396280",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#6ffbbe",
                        "secondary-fixed-dim": "#ffba38",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-secondary-container": "#6a4800",
                        "on-tertiary-fixed": "#002113",
                        "surface-container": "#eceef0",
                        "primary": "#00273c",
                        "on-primary-container": "#7fa8c8",
                        "surface-dim": "#d8dadc",
                        "tertiary-container": "#00422b",
                        "on-primary-fixed": "#001e2f",
                        "outline-variant": "#c2c7ce",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#281900",
                        "on-primary": "#ffffff",
                        "outline": "#72787e",
                        "surface-variant": "#e0e3e5",
                        "surface-container-high": "#e6e8ea",
                        "secondary-container": "#feb300",
                        "on-secondary-fixed-variant": "#604100",
                        "secondary": "#7e5700",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "inverse-on-surface": "#eff1f3",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#cae6ff",
                        "on-primary-fixed-variant": "#1e4b67",
                        "on-surface-variant": "#42474d",
                        "primary-container": "#0b3d59",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "gutter": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "md": "16px",
                        "xl": "40px",
                        "sm": "8px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "title-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "display-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "title-sm": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F7F9; /* Base Canvas Level 0 */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0px 2px 4px rgba(11, 61, 89, 0.05); /* Level 1 Shadow */
        }
        .input-focus-effect:focus-within {
            border-color: #00273c;
            box-shadow: 0 0 0 1px #00273c;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-md">
<!-- Main Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Header Section -->
<header class="mb-xl text-center flex flex-col items-center">
<div class="mb-sm flex items-center justify-center bg-primary-container rounded-xl w-12 h-12">
<span class="material-symbols-outlined text-white text-[28px]" data-icon="build">build</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">App Taller Mecánico</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs opacity-80">Gestión de Precisión Industrial</p>
</header>
<!-- Central Card Container -->
<section class="login-card w-full bg-white rounded-xl p-lg md:p-xl border border-surface-container">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Iniciar sesión</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus credenciales para continuar.</p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-lg" onsubmit="return false">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Correo electrónico</label>
<div class="relative flex items-center input-focus-effect border border-outline-variant rounded-lg transition-all duration-200 bg-white">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 pl-12 pr-md font-body-md text-body-md text-on-surface placeholder:text-outline opacity-90 outline-none" id="email" name="email" placeholder="nombre@taller.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Contraseña</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative flex items-center input-focus-effect border border-outline-variant rounded-lg transition-all duration-200 bg-white">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="lock">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 py-3 pl-12 pr-md font-body-md text-body-md text-on-surface placeholder:text-outline opacity-90 outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full bg-secondary-container text-on-secondary-container font-headline-md text-headline-md py-4 rounded-xl shadow-sm hover:brightness-95 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-sm group" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Actions -->
<div class="mt-lg pt-lg border-t border-surface-container flex flex-col items-center gap-md">
<p class="font-body-md text-body-md text-on-surface-variant">¿Nuevo en la plataforma?</p>
<button class="w-full py-3 px-md border border-primary text-primary rounded-xl font-title-sm text-title-sm hover:bg-surface-container-low transition-colors">
                    Solicitar acceso de técnico
                </button>
</div>
</section>
<!-- Footer / Support Message -->
<footer class="mt-xl text-center px-lg">
<div class="flex items-center justify-center gap-sm mb-xs text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="security">security</span>
<p class="font-label-sm text-label-sm">Conexión cifrada y segura de extremo a extremo.</p>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-70">
                ¿Necesitas ayuda? Contacta a <a class="text-primary font-semibold hover:underline" href="mailto:soporte@apptallermecanico.com">Soporte Técnico</a>
</p>
</footer>
</main>
<!-- Visual Background Element (Subtle Workshop Aesthetic) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-20">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-primary-container blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[400px] h-[400px] rounded-full bg-secondary-container blur-[100px] opacity-40"></div>
</div>
<script>
        // Simple Interaction logic for password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        const icon = toggleBtn?.querySelector('.material-symbols-outlined');

        toggleBtn?.addEventListener('click', () => {
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                icon.innerText = 'visibility';
            }
        });

        // Form submission micro-interaction
        const form = document.querySelector('form');
        form.addEventListener('submit', (e) => {
            const btn = form.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> <span>Iniciando...</span>`;
            btn.disabled = true;
            
            setTimeout(() => {
                // Mock redirect
                console.log('Logueado con éxito');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
