<div class="flex flex-col items-center justify-center p-8 space-y-4 text-center border border-error-container bg-error-container/10 rounded-xl">
  <span class="material-symbols-outlined text-error text-5xl">error</span>
  <h3 class="text-headline-md font-bold text-error">{{ displayMessage }}</h3>
  <button
    *ngIf="retry.observed"
    (click)="onRetry()"
    class="flex items-center gap-2 px-md py-xs btn-primary">
    <span class="material-symbols-outlined text-sm">refresh</span>
    <span>{{ retryLabel }}</span>
  </button>
</div>
