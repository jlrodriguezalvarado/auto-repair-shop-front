<div class="flex flex-col items-center justify-center p-8 space-y-4 text-center border border-md-error-container bg-md-error-container/10 rounded-xl">
  <span class="material-symbols-outlined text-md-error text-5xl">error</span>
  <h3 class="text-lg font-bold text-md-error">{{ displayMessage }}</h3>
  @if (retry.observed) {
    <button
      (click)="onRetry()"
      class="flex items-center gap-2 px-4 py-2 bg-md-primary text-md-on-primary hover:bg-md-primary/90 font-semibold rounded-lg transition-colors duration-200">
      <span class="material-symbols-outlined text-sm">refresh</span>
      <span>{{ retryLabel }}</span>
    </button>
  }
</div>
